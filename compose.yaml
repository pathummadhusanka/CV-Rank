services:
  backend:
    build:
      context: ./src/backend
    image: cv-rank-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///storage/cv_rank.db}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-openai/gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_HTTP_REFERER: ${AI_HTTP_REFERER:-}
      AI_APP_TITLE: ${AI_APP_TITLE:-CV-Rank}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    volumes:
      - cv-rank-storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./src/frontend
    image: cv-rank-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cv-rank-storage:
